version: "3.9"

services:

  dbserver:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: vetflow-db-image
    container_name: vetflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: vetflowdb
      POSTGRES_USER: vetflow
      POSTGRES_PASSWORD: Fiap@Cloud2026
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - vetflow-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: vetflow-api-image
    container_name: vetflow-app
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://dbserver:5432/vetflowdb
      SPRING_DATASOURCE_USERNAME: vetflow
      SPRING_DATASOURCE_PASSWORD: Fiap@Cloud2026
    ports:
      - "8080:8080"
    depends_on:
      - dbserver
    networks:
      - vetflow-network

volumes:
  db-data:
    name: vetflow-db-data

networks:
  vetflow-network:
    external: true