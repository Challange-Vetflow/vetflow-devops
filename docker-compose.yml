version: "3.9"

# VetFlow – Docker Compose (Versão com Rede Externa)
# Serviços: h2server (banco) + app (Spring Boot)

services:

  # Banco de dados H2 em modo servidor TCP
  h2server:
    build:
      context: .
      dockerfile: Dockerfile.h2
    image: vetflow-h2-image
    container_name: vetflow-h2
    restart: unless-stopped
    ports:
      - "9090:1521"   # TCP externo:interno
      - "8181:81"     # Web Console externo:interno
    volumes:
      - h2-data:/opt/h2-data
    networks:
      - vetflow-network

  # Aplicação Spring Boot (VetFlow API)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: vetflow-api-image
    container_name: vetflow-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - h2server
    networks:
      - vetflow-network

# Volume nomeado para persistência
volumes:
  h2-data:
    name: vetflow-h2-data

# Configuração da Rede como EXTERNA
networks:
  vetflow-network:
    external: true
